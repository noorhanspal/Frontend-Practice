<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Times New Roman', Times, serif;
    background: #13070c;
    background: radial-gradient(circle, rgb(42, 31, 36) 0%, rgb(22, 28, 35) 81%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .calculator {
    background-color: rgba(128, 128, 128, 0.2);
    width: 100%;
    max-width: 400px;
    border-radius: 25px;
    box-shadow: 0 0 20px rgba(227, 212, 212, 0.638);
    padding: 25px;
    border: 2px solid rgba(255, 255, 255, 0.3);
  }
  .header
  {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
  }
  .header h2 {
    font-weight: bold;
    font-size: 22px;
    text-transform: uppercase;
    color: #fff;
  }
  .header span {
    font-size: 14px;
    color: #fff;
    font-weight: bold;
    background-color: rgba(0, 0, 0, 0.1);
    padding: 5px 10px;
    border-radius: 5px;
  }
  .display {
    background-color: rgba(128, 128, 128, 0.2);
    border-radius: 10px;
    padding: 15px;
    text-align: right;
    margin-bottom: 20px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .previous {
    min-height: 25px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 10px;
    overflow-wrap: anywhere;
  }
  #result {
    width: 100%;
    height: 40px;
    border-radius: 7px;
    border: none;
    background-color: rgba(128, 128, 128, 0.2);
    box-shadow: 0 0 20px rgba(196, 183, 183, 0.797);
    padding: 10px;
    font-size: 18px;
    color: #fff;
    text-align: right;
    outline: none;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    width: 100%;
    height: 50px;
    outline: none;
    border: none;
    border-radius: 7px;
    background-color: rgba(129, 125, 125, 0.281);
    transition: 0.3s;
    text-transform: uppercase;
    font-size: 16px;
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
  }
  button:hover {
    transform: scale(1.1);
    background-color: black;
  }
  button:active {
    transform: scale(0.95);
  }
  .operator {
    background-color: rgba(129, 125, 125, 0.281);
    color: #fff;
  }
  .operator:hover {
    background-color: black;
  }
  .clear {
    background-color: rgba(255, 0, 0, 0.5);
    color: #fff;
  }
  .clear:hover {
    background-color: rgba(255, 0, 0, 0.7);
  }
  .delete {
    background-color: rgba(255, 165, 0, 0.5);
    color: #fff;
  }
  .equals {
    background-color: rgba(0, 128, 0, 0.5);
    color: #fff;
    grid-row: span 2;
    height:auto;
  }
  .equals:hover {
    background-color: rgba(0, 128, 0, 0.7);
  }
  .zero {
    grid-column: span 2;
  }
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #fff;
  }
  @media(max-width: 400px) {
    .calculator {
      width: 100%;
      padding: 20px;
    }
    .buttons {
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      height: 45px;
      font-size: 14px;
    }
    result {
      font-size: 16px;
    }
  }
</style>
<body>
  <div class="calculator">
    <div class="header">
      <h2>Smart Calculator</h2>
      <span>HTML|CSS|JavaScript</span>
    </div>
    <div class="display">
      <div class="previous" id="previous"></div>
      <input type="text" id="result" value="0" aria-label="Calculator Display" readonly>
    </div>
    <div class="buttons">
      <button class="clear" onclick="clearAll()">AC</button>
      <button class="delete" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="percentage()">%</button>
      <button class="operator" onclick="chooseOperator('/')">/</button>
      <button class="operator" onclick="appendNumber('7')">7</button>
      <button class="operator" onclick="appendNumber('8')">8</button>
      <button class="operator" onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">*</button>
      <button class="operator" onclick="appendNumber('4')">4</button> 
      <button class="operator" onclick="appendNumber('5')">5</button>
      <button class="operator" onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">-</button>
      <button class="operator" onclick="appendNumber('1')">1</button>
      <button class="operator" onclick="appendNumber('2')">2</button>
      <button class="operator" onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>
      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendDecimal()">.</button>
      <button class="equals" onclick="calculate()">=</button>

    </div>
    <div class="footer">Smart Calculator | Built with HTML, CSS, and JavaScript</div>
  </div>
</body>
</html>
