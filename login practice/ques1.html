<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="ques1.css">
</head>

<body>

    <div class="login-box">

        <!-- Graduation Image -->
        <div class="image">
            <img src="login pic.jpeg" alt="Graduation">
        </div>

        <!-- Heading -->
        <h1>Student Login</h1>

        <!-- Email -->
        <input type="email" placeholder="Edu Email ID">

        <!-- Password -->
        <input type="password" placeholder="Password">

        <!-- Login Button -->
        <button>Log In</button>

        <!-- Forgot Password -->
        <a href="#">Forgot Password?</a>

        <!-- Line -->
        <hr>

    </div>

</body>
</html>
