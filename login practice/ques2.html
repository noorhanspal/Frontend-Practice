<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
</head>
<style>
*
{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
section
{
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:url(img4.jpg);
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}
main
{
  height: 90%;
  width: 100%;
  max-width: 900px;
  padding: 20px;
  border-radius: 25px;
  border: 1px solid white;
  box-shadow: 0px 0px 10px 1px white;
  backdrop-filter: blur(50px);   
}
.sign
{
  display: flex;
  width:100%;
  height: 100%;
  border-radius: 25px;
  border: 1px solid white;
  box-shadow: 0px 0px 10px 1px white;
  background: white;
  
}
.left
{
  width: 50%;
  height: 100%;
  float: left;
  padding: 20px;
}
.left h1
{
  font-size: 30px;
  font-weight: 600;
  color: black;
  transform: capitalize;
  margin-bottom: 40px;
}
.right
{
  width: 50%;
  height: 100%;
}
.right img
{
  width: 100%;
  height: 100%;
  border-radius: 50% 25px 25px 50%;
}
.label
{
  display:flex;
  font-size: 20px;
  font-weight: 600;
  color: black;
  transform: capitalize;
  margin-bottom: 20px;
}
.input
{
  width: 100%;
  height: 40px;
  border-radius: 5px;
  background: rgba(128, 128, 128, 0.126);
  margin-bottom: 20px;
  border:none;
  padding: 0px 10px;
}
.pass
{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.p1 a
{
  text-decoration: none;
  color: rgba(0, 0, 0, 0.685);
  font-size: 15px;
}
button
{
  width: 100%;
  height: 40px;
  border-radius: 5px;
  background: rgba(47, 47, 190, 0.856);
  margin-bottom: 20px;
  border:none;
  margin-top: 20px;
  color: white;
  font-size: 20px;
}
.p2 
{
  text-decoration: none;
  color: rgba(0, 0, 0, 0.685);
  font-size: 15px;
  display: flex;
  justify-content: center;
}
</style>
<body>
  <section>
    <main>
      <div class="sign">
        <div class="left">
          <h1>Sign in to your account</h1>
          <label for="email" class="label">Email</label>
          <input type="email" placeholder="Enter your email" class="input">
          <div class="pass">
            <label for="password" class="label">Password</label>
            <p class="p1"><a href="#">Forgot Password</a></p>
          </div>
          <input type="password" placeholder="password" class="input">
          <button>Sign in</button>
          <p class="p2">Not Register yet?<a href="#">Create an Account</a></p>
        </div>
        <div class="right">
          <img src="img2" alt="image">
        </div>
      </div>
    </main>
  </section>
</body>
</html>
