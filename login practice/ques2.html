<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
</head>
<style>
*
{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
section
{
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:url(img4.jpg);
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}
main
{
  height: 90%;
  width: 100%;
  max-width: 900px;
  padding: 20px;
  border-radius: 25px;
  border: 1px solid white;
  box-shadow: 0px 0px 10px 1px white;
  backdrop-filter: blur(50px);   
}
.sign
{
  display: flex;
  width:100%;
  height: 100%;
  border-radius: 25px;
  border: 1px solid white;
  box-shadow: 0px 0px 10px 1px white;
  background: white;
  
}
.left
{
  width: 50%;
  height: 100%;
  float: left;
  padding: 20px;
}
.left h1
{
  font-size: 30px;
  font-weight: 600;
  color: black;
  transform: capitalize;
  margin-bottom: 40px;
}
.right
{
  width: 50%;
  height: 100%;
}
.right img
{
  width: 100%;
  height: 100%;
  border-radius: 50% 25px 25px 50%;
}
.label
{
  display:flex;
  font-size: 20px;
  font-weight: 600;
  color: black;
  transform: capitalize;
  margin-bottom: 20px;
}
.input
{
  width: 100%;
  height: 40px;
  border-radius: 5px;
  background: rgba(128, 128, 128, 0.126);
  margin-bottom: 20px;
  border:none;
  padding: 0px 10px;
}
.pass
{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.p1 a
{
  text-decoration: none;
  color: rgba(0, 0, 0, 0.685);
  font-size: 15px;
}
button
{
  width: 100%;
  height: 40px;
  border-radius: 5px;
  background: rgba(47, 47, 190, 0.856);
  margin-bottom: 20px;
  border:none;
  margin-top: 20px;
  color: white;
  font-size: 20px;
}
.p2 
{
  text-decoration: none;
  color: rgba(0, 0, 0, 0.685);
  font-size: 15px;
  display: flex;
  justify-content: center;
}

.wrapper span
{
    position: fixed;
    bottom:-100px;
    font-size: 80px;
    animation: move 10s infinite linear;
    z-index: 0;
}
.wrapper span:nth-child(1)
{
    left: 10px;
    animation-delay: 1s;
}
.wrapper span:nth-child(2)
{
    left: 10%;
    animation-delay: 2s;
}
.wrapper span:nth-child(3)
{
    left: 20%;
    animation-delay: 3s;
}
.wrapper span:nth-child(4)
{
    left: 30%;
    animation-delay: 1.5s;
}
.wrapper span:nth-child(5)
{
    left: 40%;
    animation-delay: 2.5s;
}
.wrapper span:nth-child(6)
{
    left: 50%;
    animation-delay: 3.5s;
}
.wrapper span:nth-child(7)
{
    left: 60%;
    animation-delay: .5s;
}
.wrapper span:nth-child(8)
{
    left: 70%;
    animation-delay: 1.4s;
}
.wrapper span:nth-child(9)
{
    left: 80%;
    animation-delay: 2.3s;
}
.wrapper span:nth-child(10)
{
    left: 90%;
    animation-delay: 3.5s;
}
@keyframes move
{
    100%
    {
        transform: translateY(-800px)rotate(360deg);
    }
}

</style>
<body>
  <div class="wrapper">
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
    </div>

  <section>
    <main>
      <div class="sign">
        <div class="left">
          <h1>Sign in to your account</h1>
          <label for="email" class="label">Email</label>
          <input type="email" placeholder="Enter your email" class="input">
          <div class="pass">
            <label for="password" class="label">Password</label>
            <p class="p1"><a href="#">Forgot Password</a></p>
          </div>
          <input type="password" placeholder="password" class="input">
          <button>Sign in</button>
          <p class="p2">Not Register yet?<a href="#">Create an Account</a></p>
        </div>
        <div class="right">
          <img src="img2" alt="image">
        </div>
      </div>
    </main>
  </section>
</body>
</html>
