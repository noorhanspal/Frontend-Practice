<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parralax Effect</title>
</head>
<style>
  *
  {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  section{
    height: 100vh;
    width: 100%;
    font-family: Georgia, 'Times New Roman', Times, serif;
    display: grid;
    text-align: center;
    align-items: center;
    justify-content: center;
    background-image: url(img1.jpg);
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    color: whitesmoke;
    background-attachment: fixed;
  }
  .section2
  {
    background-image: url(img2.jpg);
    background-position: center;
    background-size: 100% 100%;
  }
  .section3
  {
    background-image: url(img3.jpg);
    background-position: center;
    background-size: 100% 100%;
    background-attachment: fixed;
  }
  .section4
  {
    background-image: url(img4.jpg);
    background-position: center;
    background-size: 100% 100%;
  }

</style>
<body>
  <section class="section1">
    <div>
      <h1>Hello,There!</h1>
      <p>I am Noor Hanspal</p>
    </div>
  </section>
  <section class="section2">
    <div>
      <h1>CSS Parallax</h1>
      <p>Cuurently,learning parallax effect</p>
    </div>
  </section><section class="section3">
    <div>
      <h1>Graduation</h1>
      <p>I have completed my B.tech Cse with good marks</p>
    </div>
  </section><section class="section4">
    <div>
      <h1>My Cgpa!</h1>
      <p>I got 8.57 cgpa</p>
    </div>
  </section>
</body>
</html>
